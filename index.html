<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="秒答地图">
<title>秒答地图</title>
<style>
/* 布局：一屏工具。首页 = 状态条 + 模式按钮 + 7 个世界地图；练习页 = 全屏大卡片，点任意处推进 */
:root{
  color-scheme: dark;
  --cave:#1b1d22;      /* 洞穴底色 */
  --stone:#2a2d34;     /* 石块面板 */
  --stone-hi:#3a3e47;
  --ink:#ecebe4;       /* 主文字 */
  --mute:#9a9ca6;
  --grass:#5d9b3a;     /* 主强调：草方块绿 */
  --lv0:#3a3e47; --lv1:#fff3b0; --lv2:#f6a5a0; --lv3:#b3261e;
  --ok:#7bd88f; --warn:#f2c14e;
  --f-num:ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "PingFang SC", system-ui, sans-serif;
  --f-px:ui-monospace, Menlo, monospace;
  --f-cn:"PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--cave);color:var(--ink);font-family:var(--f-cn);margin:0;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:16px 32px;display:flex;flex-direction:column;gap:16px}

/* 顶部 */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:clamp(22px,4vw,30px);font-weight:900;letter-spacing:.04em;display:flex;align-items:center;gap:10px}
.top h1 .px{font-family:var(--f-px);font-size:10px;background:var(--grass);color:#fff;padding:6px 8px;border:2px solid #000}
.sync{font-size:12px;color:var(--mute)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;background:var(--stone);border:2px solid #000;padding:6px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.chip i{width:14px;height:14px;border:2px solid #000;display:inline-block}

/* 模式按钮 */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mbtn{background:var(--stone);border:3px solid #000;box-shadow:inset -4px -4px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.08);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.mbtn b{font-size:19px;font-weight:900}
.mbtn span{font-size:13px;color:var(--mute);line-height:1.45}
.mbtn.main{background:var(--grass);color:#fff}
.mbtn.main span{color:#e6f5dc}
.mbtn:active{transform:translateY(2px)}
.hint{background:#3b3420;border:2px solid var(--warn);padding:10px 14px;font-size:14px;line-height:1.55}

/* 地图 */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);align-items:center}
.legend i{display:inline-block;width:18px;height:14px;border:2px solid #000;vertical-align:-3px;margin-right:5px}
.world{background:var(--stone);border:2px solid #000;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.wh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wh .tag{font-family:var(--f-px);font-size:9px;color:#fff;padding:5px 6px;border:2px solid #000}
.wh b{font-size:15px;font-weight:900}
.wh .cnt{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.wh .sp{flex:1}
.sbtn{background:var(--stone-hi);border:2px solid #000;padding:6px 10px;font-size:13px;font-weight:700}
.sbtn[disabled]{opacity:.35;cursor:not-allowed}
.sbtn.boss{background:#5a1f1a;color:#ffd9d4}
.blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:4px}
.b{height:32px;border:2px solid #000;display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-weight:900;font-size:14px;background:var(--lv0);color:var(--mute);font-variant-numeric:tabular-nums}
.b.l1{background:var(--lv1);color:#4a3d00}
.b.l2{background:var(--lv2);color:#5a1410}
.b.l3{background:var(--lv3);color:#fff}
.b.new{outline:3px solid var(--warn);outline-offset:-5px}

.tools{display:flex;gap:10px;flex-wrap:wrap}
.panel{background:var(--stone);border:2px solid #000;padding:12px;display:flex;flex-direction:column;gap:8px}
.panel textarea{width:100%;min-height:90px;background:var(--cave);color:var(--ink);border:2px solid #000;font:12px ui-monospace,monospace;padding:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{font-size:13px;color:var(--ok)}

/* 练习页 */
.play{position:fixed;inset:0;background:var(--cave);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.pbar{display:flex;align-items:center;gap:10px;padding:12px 16px}
.pbar .ttl{font-weight:900;font-size:15px}
.dots{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.timer{font-size:13px;color:var(--mute);opacity:.7;font-variant-numeric:tabular-nums;white-space:nowrap}
.timer.done{color:var(--ok);opacity:.9}
.dots i{width:12px;height:12px;border:2px solid #000;background:var(--stone-hi)}
.dots i.cur{background:var(--ink)}
.dots i.fast{background:var(--ok)}
.dots i.done{background:#6b6f7a}
.dots i.wrong{background:#8a4a44}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;padding:16px;user-select:none;-webkit-user-select:none;touch-action:manipulation;min-height:0}
.wname{font-size:14px;font-weight:700;padding:4px 10px;border:2px solid #000;color:#fff}
.q{font-family:var(--f-num);font-weight:900;font-size:clamp(72px,17vw,200px);line-height:1;letter-spacing:.04em;white-space:nowrap;font-variant-numeric:tabular-nums}
.q .ans{color:var(--warn)}
.res{min-height:64px;display:flex;flex-direction:column;align-items:center;gap:6px}
.badge{font-size:clamp(22px,4vw,34px);font-weight:900}
.badge.fast{color:var(--ok)}
.badge.wrong{color:#ff9b8f}
.time{font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
.tap{font-size:14px;color:var(--mute)}
.pfoot{display:flex;justify-content:center;gap:12px;padding:12px 16px 18px;flex-wrap:wrap}
.pfoot button{min-width:150px;padding:14px 18px;border:3px solid #000;font-size:17px;font-weight:900;background:var(--stone)}
.pfoot .wrongbtn.on{background:#8a2f27;color:#fff}

/* 结算 */
.sum{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;padding:24px 16px;overflow:auto}
.sum h2{margin:0;font-size:30px;font-weight:900}
.big{font-family:var(--f-num);font-size:64px;font-weight:900;line-height:1}
.ups{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:640px}
.ups .b{width:64px}
.gem{background:#20363a;border:2px solid #4fd6d0;padding:10px 16px;font-size:15px}
@media (prefers-reduced-motion:no-preference){ .q{transition:transform .08s} .stage:active .q{transform:scale(.985)} }
</style>
</head>
<body>

<div class="wrap" id="home">
  <div class="panel" id="testBar" hidden style="border-color:var(--warn)">
    <div style="font-weight:900;color:var(--warn)">测试模式 · 这里的数据和孩子的正式进度分开，互不影响</div>
    <div class="row"><span class="time" id="testDay"></span></div>
    <div class="row">
      <button class="sbtn" data-t="day+1">日期 +1 天</button>
      <button class="sbtn" data-t="day+3">日期 +3 天</button>
      <button class="sbtn" data-t="day0">回到真实今天</button>
    </div>
    <div class="row">
      <button class="sbtn" data-t="w1y">世界 1 全部淡黄（昨天）</button>
      <button class="sbtn" data-t="w1r">世界 1 全部淡红（3 天前）</button>
      <button class="sbtn" data-t="w1d">世界 1 全部深红（解锁 Boss）</button>
      <button class="sbtn" data-t="alld">全部深红（解锁末影龙）</button>
      <button class="sbtn" data-t="reset">清空测试数据</button>
    </div>
  </div>
  <div class="top">
    <h1><span class="px">SPEED MAP</span>秒答地图</h1>
    <div class="sync" id="sync">正在读取进度…</div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="hint" id="hint" hidden></div>
  <div class="modes">
    <button class="mbtn main" id="btnDaily"><b>单次练习</b><span>题数不限，想停就点「结束」· 结束后显示本次总结 · 待升级的卡优先，开头都是会的</span></button>
    <button class="mbtn" id="btnScan"><b>摸底（可选）</b><span>想一次把某个世界全过一遍时，点地图里那个世界的「摸底」</span></button>
  </div>
  <div class="legend">
    <span><i style="background:var(--lv0)"></i>还没秒答</span>
    <span><i style="background:var(--lv1)"></i>淡黄：第 1 天秒答</span>
    <span><i style="background:var(--lv2)"></i>淡红：另一天又秒答</span>
    <span><i style="background:var(--lv3)"></i>深红：隔 3 天以上再秒答</span>
    <span>秒答 = 2 秒内说对</span>
  </div>
  <div id="map"></div>
  <div class="tools">
    <button class="sbtn" id="btnExport">导出备份</button>
    <button class="sbtn" id="btnImport">导入备份</button>
  </div>
  <div class="panel" id="ioPanel" hidden>
    <div id="ioTitle" style="font-weight:900"></div>
    <textarea id="ioText" aria-label="备份内容"></textarea>
    <div class="row">
      <button class="sbtn" id="ioCopy">复制</button>
      <button class="sbtn" id="ioApply" hidden>确认导入（会覆盖当前进度）</button>
      <button class="sbtn" id="ioClose">关闭</button>
      <span class="msg" id="ioMsg"></span>
    </div>
  </div>
</div>

<div class="play" id="play" hidden>
  <div class="pbar">
    <button class="sbtn" id="btnQuit">退出</button>
    <span class="ttl" id="pTitle"></span>
    <div class="dots" id="dots"></div>
    <span class="timer" id="timer" hidden></span>
  </div>
  <div class="stage" id="stage">
    <div class="wname" id="wname"></div>
    <div class="q" id="q"></div>
    <div class="res" id="res"></div>
  </div>
  <div class="pfoot" id="pfoot" hidden>
    <button class="wrongbtn" id="btnWrong">答错了（X）</button>
    <button id="btnNext" style="background:var(--grass);color:#fff">下一题（空格）</button>
  </div>
</div>

<div class="play" id="summary" hidden>
  <div class="sum" id="sumBody"></div>
</div>

<script>
window.addEventListener("error", function (e) { var d = document.createElement("div"); d.style.cssText = "position:fixed;left:0;right:0;bottom:0;background:#8a2f27;color:#fff;padding:12px 16px;font:14px sans-serif;z-index:99"; d.textContent = "页面出错了，请截图发给维护的人：" + (e.message || e); document.body.appendChild(d); });
(() => {
  // ---------- 卡片定义（与打印版完全一致：7 个世界 110 张） ----------
  const WORLDS = [
    {name:'世界 1 · 草地', c:'#5d9b3a', nums:[2,3,4,5]},
    {name:'世界 2 · 森林', c:'#3f6e25', nums:[6]},
    {name:'世界 3 · 沙漠', c:'#b8921c', nums:[7]},
    {name:'世界 4 · 雪山', c:'#4f8fc0', nums:[8]},
    {name:'世界 5 · 矿洞', c:'#7d7d7d', nums:[9]},
    {name:'世界 6 · 下界', c:'#a8322d', nums:[10]},
    {name:'世界 7 · 末地', c:'#5b4a9a', zero:true},
  ];
  const CARDS = []; // {id, w, a, op, b, ans}
  WORLDS.forEach((w, wi) => {
    const add = [], sub = [];
    if (w.zero) {
      [2,4,6,8,10].forEach(n => { add.push([n,'+',0]); sub.push([n,'-',0]); });
      [1,3,5,7,9].forEach(n => { add.push([0,'+',n]); sub.push([n,'-',n]); });
    } else w.nums.forEach(n => { for (let a = 1; a < n; a++) { add.push([a,'+',n-a]); sub.push([n,'-',a]); } });
    add.concat(sub).forEach(([a,op,b]) => CARDS.push({id:a+op+b, w:wi, a, op, b, ans: op==='+'?a+b:a-b}));
  });
  const BYID = Object.fromEntries(CARDS.map(c => [c.id, c]));
  const show = c => `${c.a} ${c.op==='+'?'+':'−'} ${c.b}`;

  // ---------- 规则 ----------
  const FAST_MS = 2000, STUCK_MS = 5000, GAP_DAYS = 3;
  const TEST = location.hash === '#test';
  window.addEventListener('hashchange', () => location.reload());
  const today = () => { const d = new Date(Date.now() + (TEST ? (S.testDays || 0) * 864e5 : 0)); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
  const dayDiff = (a, b) => Math.round((new Date(b+'T00:00') - new Date(a+'T00:00')) / 864e5);

  // ---------- 状态 ----------
  const blank = () => ({v:1, savedAt:0, cards:{}, boss:{}, log:{}});
  let S = blank();
  const cs = id => (S.cards[id] = S.cards[id] || {lv:0, intro:false, d:[], seen:0, last:''});

  // 升级：2 秒内答对时调用；返回是否升级
  function tryUp(id) {
    const c = cs(id), t = today();
    if (c.lv === 0) { c.lv = 1; c.d[0] = t; return true; }
    if (c.lv === 1 && c.d[0] !== t) { c.lv = 2; c.d[1] = t; return true; }
    if (c.lv === 2 && dayDiff(c.d[1], t) >= GAP_DAYS) { c.lv = 3; c.d[2] = t; return true; }
    return false; // 只升不降，一天最多一级
  }

  // ---------- 存储：只存在这台设备的浏览器里 ----------
  const LS = TEST ? 'speedmap.test' : 'speedmap.v1';
  const lsGet = () => { try { return JSON.parse(localStorage.getItem(LS) || 'null'); } catch { return null; } };
  let canSave = true;
  function save() {
    S.savedAt = Date.now();
    try { localStorage.setItem(LS, JSON.stringify(S)); } catch { canSave = false; }
  }
  function boot() {
    const local = lsGet(); if (local && local.cards) S = Object.assign(blank(), local);
    try { localStorage.setItem(LS + '.probe', '1'); localStorage.removeItem(LS + '.probe'); } catch { canSave = false; }
    document.getElementById('sync').textContent = canSave ? '进度保存在这台设备上 · 记得定期导出备份' : '这个浏览器不能保存进度（可能是无痕模式），关掉页面进度会丢';
    renderHome();
  }

  // ---------- 首页 ----------
  const $ = id => document.getElementById(id);
  const worldCards = wi => CARDS.filter(c => c.w === wi);
  const worldDone = wi => worldCards(wi).every(c => cs(c.id).lv === 3);
  var renderHome = function () {
    const n = [0,0,0,0]; CARDS.forEach(c => n[cs(c.id).lv]++);
    $('stats').innerHTML =
      `<span class="chip"><i style="background:var(--lv3)"></i>深红 ${n[3]}</span>` +
      `<span class="chip"><i style="background:var(--lv2)"></i>淡红 ${n[2]}</span>` +
      `<span class="chip"><i style="background:var(--lv1)"></i>淡黄 ${n[1]}</span>` +
      `<span class="chip">共 ${CARDS.length} 张</span>`;
    const anyIntro = CARDS.some(c => cs(c.id).seen > 0);
    $('hint').hidden = anyIntro;
    $('hint').textContent = '第一次用：直接点「单次练习」。会先从世界 1 随机出题，会的卡当场点亮。';
    const t = today(), todayUp = new Set((S.log[t]||{}).ups || []);
    const allDone = WORLDS.every((w, i) => worldDone(i));
    $('map').innerHTML = WORLDS.map((w, wi) => {
      const cards = worldCards(wi), lit = cards.filter(c => cs(c.id).lv === 3).length;
      const won = S.boss[wi] ? ` · Boss 已通关` : '';
      return `<div class="world" style="margin-bottom:10px">
        <div class="wh"><span class="tag" style="background:${w.c}">${cards.length}</span><b>${w.name}</b>
          <span class="cnt">深红 ${lit}/${cards.length}${won}</span><span class="sp"></span>
          <button class="sbtn" data-scan="${wi}">摸底</button>
          <button class="sbtn boss" data-boss="${wi}" ${worldDone(wi)?'':'disabled'} title="全部深红后解锁">Boss 关</button>
        </div>
        <div class="blocks">${cards.map(c => `<div class="b l${cs(c.id).lv}${todayUp.has(c.id)?' new':''}" title="${show(c)}">${c.a}${c.op==='+'?'+':'−'}${c.b}</div>`).join('')}</div>
      </div>`;
    }).join('') + `<div class="world"><div class="wh"><span class="tag" style="background:#000">30</span><b>最终 Boss · 末影龙</b>
      <span class="cnt">${S.boss.dragon?'已击败':'7 个世界全部深红后解锁'}</span><span class="sp"></span>
      <button class="sbtn boss" data-boss="dragon" ${allDone?'':'disabled'}>挑战末影龙</button></div></div>`;
  }
  $('map').addEventListener('click', e => {
    const s = e.target.closest('[data-scan]'), b = e.target.closest('[data-boss]');
    if (s) startScan(+s.dataset.scan);
    else if (b && !b.disabled) startBoss(b.dataset.boss);
  });
  $('btnScan').addEventListener('click', () => { $('map').scrollIntoView({behavior:'smooth'}); });

  // ---------- 出题 ----------
  const shuffle = (a, rnd = Math.random) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
  const DECK = 20, LEARN_MAX = 4, PROBE_MIN = 6;
  const stOf = (S, id) => S.cards[id] || { lv: 0, seen: 0, d: [], last: '' };
  // 今天答对就能升级的卡
  const isDue = (s, t) => (s.lv === 1 && s.d[0] !== t) || (s.lv === 2 && dayDiff(s.d[1], t) >= GAP_DAYS);
  function buildDaily(S, CARDS, t, rnd = Math.random) {
  const st = c => stOf(S, c.id);
  const due = shuffle(CARDS.filter(c => isDue(st(c), t)), rnd);
  // 练过但还没秒答的卡：最久没练的优先，每轮最多 4 张，每张出 2 次
  const backlog = CARDS.filter(c => st(c).lv === 0 && st(c).seen > 0)
    .sort((x, y) => (st(x).last || '').localeCompare(st(y).last || ''));
  const learning = backlog.slice(0, LEARN_MAX);
  // 没练会的卡少于 3 张，才加新卡；否则先把手上的练会
  const probeCap = backlog.length < 3 ? DECK : 0;
  // 没见过的卡：从最前面还有新卡的世界里随机抽（会的直接点亮，不会的进入练习）
  const unseen = [];
  for (let w = 0; unseen.length < DECK && w < 7; w++) unseen.push(...shuffle(CARDS.filter(c => c.w === w && st(c).seen === 0), rnd));
  const known = shuffle(CARDS.filter(c => st(c).lv >= 1 && !isDue(st(c), t)), rnd);

  const pick = [];
  const room = () => DECK - pick.length;
  learning.forEach(c => pick.push(c, c));
  pick.push(...unseen.splice(0, Math.min(PROBE_MIN, probeCap, room())));
  pick.push(...due.splice(0, room()));
  pick.push(...known.splice(0, room()));
  pick.push(...unseen.splice(0, Math.min(probeCap, room())));

  // 排序：开头 3 题、结尾 3 题放会的卡（淡黄以上）；中间打乱，同一张卡至少隔 3 题
  const easyIds = new Set(CARDS.filter(c => st(c).lv >= 1).map(c => c.id));
  const easy = shuffle(pick.filter(c => easyIds.has(c.id)), rnd);
  const rest = pick.filter(c => !easyIds.has(c.id));
  let head = [], tail = [];
  if (easy.length >= 6) { head = easy.splice(0, 3); tail = easy.splice(0, 3); }
  const mid = spread(shuffle(rest.concat(easy), rnd), rnd);
  return head.concat(mid, tail);
}
// 打散：同一张卡在牌堆里至少隔 3 个位置
function spread(arr, rnd) {
  for (let tries = 0; tries < 200; tries++) {
    let ok = true;
    for (let i = 0; i < arr.length && ok; i++)
      for (let k = 1; k <= 3 && i + k < arr.length; k++)
        if (arr[i].id === arr[i + k].id) { ok = false; break; }
    if (ok) return arr;
    shuffle(arr, rnd);
  }
  return arr;
}

  // ---------- 练习流程 ----------
  let P = null; // {mode, title, deck, warm, i, t0, phase, ms, wrong, results:[], ups:[], misses}
  function start(mode, title, deck, warm, extra) {
    P = {mode, title, deck, warm: warm || [], i:0, phase:'q', results:[], ups:[], misses:0, startAt: Date.now(), ...extra};
    $('home').hidden = true; $('summary').hidden = true; $('play').hidden = false;
    $('pTitle').textContent = title;
    $('btnQuit').textContent = mode === 'daily' ? '结束' : '退出';
    clearInterval(timerId); $('timer').hidden = mode !== 'daily'; $('timer').classList.remove('done');
    if (mode === 'daily') { tick(); timerId = setInterval(tick, 1000); }
    try { navigator.wakeLock?.request('screen').then(l => P && (P.lock = l)).catch(()=>{}); } catch {}
    showQ();
  }
  // 10 分钟倒计时：只做提示，到点不打断练习
  const GOAL_MS = 10 * 60 * 1000; let timerId = null;
  function tick() {
    if (!P) return clearInterval(timerId);
    const left = GOAL_MS - (Date.now() - P.startAt);
    if (left <= 0) { $('timer').textContent = '10 分钟 ✓'; $('timer').classList.add('done'); clearInterval(timerId); return; }
    const sec = Math.ceil(left / 1000);
    $('timer').textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  }
  function startDaily() { start('daily', '单次练习', buildDaily(S, CARDS, today()), CARDS.filter(c => cs(c.id).lv >= 1)); }
  // 单次练习不设题数：一批出完就按最新进度再出一批，开头避开刚出过的卡
  function moreCards() {
    const recent = new Set(P.deck.slice(-3).map(c => c.id));
    const batch = buildDaily(S, CARDS, today());
    for (let k = 0; k < batch.length && recent.has(batch[0].id); k++) batch.push(batch.shift());
    P.deck.push(...batch);
    P.warm = CARDS.filter(c => cs(c.id).lv >= 1);
  }
  function startScan(wi) { const d = shuffle(worldCards(wi).slice()); start('scan', '摸底 · ' + WORLDS[wi].name, d, []); }
  function startBoss(key) {
    let pool, n, title;
    if (key === 'dragon') { pool = CARDS; n = 30; title = '最终 Boss · 末影龙'; }
    else { pool = worldCards(+key); n = 20; title = 'Boss 关 · ' + WORLDS[+key].name; }
    const deck = []; while (deck.length < n) deck.push(...shuffle(pool.slice()));
    start('boss', title, deck.slice(0, n), [], {bossKey:key});
  }
  function renderDots() {
    if (P.mode === 'daily') {
      const f = P.results.filter(r => r && r.fast).length;
      $('dots').innerHTML = `<span class="time">第 ${P.i + 1} 题 · ⚡ 秒答 ${f}</span>`;
      return;
    }
    $('dots').innerHTML = P.deck.map((c, k) => {
      const r = P.results[k];
      const cls = k === P.i ? 'cur' : r ? (r.wrong ? 'wrong' : r.fast ? 'fast' : 'done') : '';
      return `<i class="${cls}"></i>`;
    }).join('');
  }
  function showQ() {
    const c = P.deck[P.i];
    P.phase = 'q'; P.wrong = false;
    const w = WORLDS[c.w];
    $('wname').textContent = w.name; $('wname').style.background = w.c;
    $('q').textContent = show(c) + ' = ?';
    $('res').innerHTML = `<div class="tap">说出答案后，点屏幕或按空格看答案</div>`;
    $('pfoot').hidden = true;
    renderDots();
    // 等题目真正画到屏幕上再开始计时
    P.t0 = performance.now(); // 先记下起点，画面刷新后再校准，保证用时永远有效
    const myI = P.i; requestAnimationFrame(() => requestAnimationFrame(() => { if (P && P.i === myI && P.phase === 'q') P.t0 = performance.now(); }));
  }
  function reveal() {
    P.ms = Math.max(0, performance.now() - P.t0);
    P.phase = 'a';
    const c = P.deck[P.i];
    $('q').innerHTML = `${show(c)} = <span class="ans">${c.ans}</span>`;
    drawResult();
    $('pfoot').hidden = false;
  }
  function drawResult() {
    const fast = P.ms <= FAST_MS;
    const badge = P.wrong ? '<div class="badge wrong">这张再练一下</div>'
      : fast ? '<div class="badge fast">⚡ 秒答！</div>' : '<div class="badge">✓</div>';
    $('res').innerHTML = badge + `<div class="time">${(P.ms/1000).toFixed(1)} 秒</div>`;
    $('btnWrong').classList.toggle('on', P.wrong);
    $('btnWrong').textContent = P.wrong ? '其实答对了（X）' : '答错了（X）';
  }
  function toggleWrong() { if (!P || P.phase !== 'a') return; P.wrong = !P.wrong; drawResult(); }
  function commit() {
    const c = P.deck[P.i], fast = !P.wrong && P.ms <= FAST_MS;
    const st = cs(c.id); st.seen++; st.last = new Date().toISOString(); st.intro = true;
    let up = false;
    if (fast) up = tryUp(c.id);
    if (up) { P.ups.push(c.id); const L = (S.log[today()] = S.log[today()] || {ups:[], n:0}); if (!L.ups.includes(c.id)) L.ups.push(c.id); }
    P.results[P.i] = {id:c.id, fast, wrong:P.wrong, ms:P.ms};
    (S.log[today()] = S.log[today()] || {ups:[], n:0}).n++;
    save();
    // 连着两张卡住，下一张换成会的卡
    const stuck = P.wrong || P.ms > STUCK_MS;
    P.misses = stuck ? P.misses + 1 : 0;
    if (P.mode === 'daily' && P.misses >= 2 && P.i + 1 < P.deck.length && P.warm.length) {
      const easy = P.warm.find(w => cs(w.id).lv >= 2) || P.warm[0];
      P.deck.splice(P.i + 1, 0, easy);
      P.misses = 0;
    }
    P.i++;
    if (P.i >= P.deck.length) { if (P.mode === 'daily') moreCards(); else return finish(); }
    showQ();
  }
  function advance() { if (!P) return; if (P.phase === 'q') reveal(); else commit(); }

  $('stage').addEventListener('pointerdown', e => { e.preventDefault(); advance(); });
  $('btnNext').addEventListener('click', e => { e.stopPropagation(); if (P && P.phase === 'a') commit(); });
  $('btnWrong').addEventListener('click', e => { e.stopPropagation(); toggleWrong(); });
  $('btnQuit').addEventListener('click', () => finish(true));
  $('btnDaily').addEventListener('click', startDaily);
  document.addEventListener('keydown', e => {
    if (!P || $('play').hidden) return;
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); advance(); }
    else if (e.key === 'x' || e.key === 'X') toggleWrong();
    else if (e.key === 'Escape') finish(true);
  });

  function finish(quit) {
    const done = P.results.filter(Boolean), fast = done.filter(r => r.fast).length;
    clearInterval(timerId);
    try { P.lock && P.lock.release(); } catch (e) {}
    const goHome = () => { $('summary').hidden = true; $('play').hidden = true; $('home').hidden = false; P = null; renderHome(); window.scrollTo(0,0); };
    if (!done.length) return goHome();
    const wrong = done.filter(r => r.wrong).length;
    const mins = Math.max(1, Math.round((Date.now() - P.startAt) / 60000));
    const okTimes = done.filter(r => !r.wrong).map(r => r.ms);
    const avg = okTimes.length ? (okTimes.reduce((a, b) => a + b, 0) / okTimes.length / 1000).toFixed(1) : '–';
    const blk = id => { const c = BYID[id]; return `<div class="b l${cs(id).lv}">${c.a}${c.op==='+'?'+':'−'}${c.b}</div>`; };
    const lastOf = {}; done.forEach(r => { lastOf[r.id] = r; });
    const again = Object.values(lastOf).filter(r => !r.fast).map(r => r.id).slice(0, 12); // 按这次最后一次作答判断
    let bossLine = '';
    if (P.mode === 'boss' && !quit) {
      const need = Math.ceil(P.deck.length * 0.9);
      if (fast >= need) { S.boss[P.bossKey] = today(); save(); bossLine = `<div class="badge fast">Boss 被打败了！</div>`; }
      else bossLine = `<div class="time">秒答 ${need} 题就能打败 Boss，想打随时再来</div>`;
    }
    const title = P.mode === 'daily' ? '本次练习总结' : quit ? '先练到这里' : '练完啦';
    const gem = P.mode === 'daily' && Date.now() - P.startAt >= GOAL_MS ? `<div class="gem">练满 10 分钟了，去贴 1 颗珠子</div>` : '';
    $('sumBody').innerHTML = `
      <h2>${title}</h2>
      <div class="big">⚡ ${fast}<span style="font-size:28px;color:var(--mute)"> / ${done.length}</span></div>
      <div class="time">秒答 ${fast} 题 · 共答 ${done.length} 题 · 答错 ${wrong} 题 · 用时约 ${mins} 分钟 · 答对的平均 ${avg} 秒</div>
      ${bossLine}
      ${P.ups.length ? `<div style="font-weight:900">这次升级的方块（去墙上的地图涂上这个颜色）</div><div class="ups">${P.ups.map(blk).join('')}</div>` : '<div class="time">这次没有方块升级</div>'}
      ${again.length ? `<div style="font-weight:900">这几张下次多练练</div><div class="ups">${again.map(blk).join('')}</div>` : ''}
      ${gem}
      <div class="row" style="justify-content:center">
        <button class="mbtn main" id="sumHome" style="min-width:200px;text-align:center"><b>回到地图</b></button>
      </div>`;
    $('play').hidden = true; $('summary').hidden = false;
    $('sumHome').addEventListener('click', goHome);
  }

  // ---------- 备份 ----------
  function openIO(mode) {
    $('ioPanel').hidden = false; $('ioMsg').textContent = '';
    $('ioTitle').textContent = mode === 'out' ? '把下面这段文字复制下来，存到备忘录里' : '把之前导出的备份文字粘贴到下面';
    $('ioText').value = mode === 'out' ? JSON.stringify(S) : '';
    $('ioCopy').hidden = mode !== 'out'; $('ioApply').hidden = mode === 'out';
  }
  $('btnExport').addEventListener('click', () => openIO('out'));
  $('btnImport').addEventListener('click', () => openIO('in'));
  $('ioClose').addEventListener('click', () => { $('ioPanel').hidden = true; });
  $('ioCopy').addEventListener('click', () => {
    navigator.clipboard.writeText($('ioText').value).then(() => { $('ioMsg').textContent = '已复制'; })
      .catch(() => { $('ioText').select(); $('ioMsg').textContent = '请长按文字手动复制'; });
  });
  $('ioApply').addEventListener('click', () => {
    try {
      const v = JSON.parse($('ioText').value);
      if (!v || typeof v.cards !== 'object') throw 0;
      S = Object.assign(blank(), v); save(); renderHome(); $('ioMsg').textContent = '已导入';
    } catch { $('ioMsg').textContent = '这段文字不是有效的备份，请重新粘贴'; }
  });

  // ---------- 测试模式 ----------
  if (TEST) {
    $('testBar').hidden = false;
    const showDay = () => { $('testDay').textContent = `当前模拟日期：${today()}（比真实日期 ${S.testDays ? '晚 ' + S.testDays + ' 天' : '相同'}）`; };
    const shift = (n) => { const d = new Date(Date.now() + ((S.testDays || 0) + n) * 864e5); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
    const setLv = (cards, lv, back) => cards.forEach(c => {
      const st = cs(c.id); st.lv = lv; st.seen = Math.max(st.seen, 1); st.intro = true;
      st.d = [shift(-back - 1), shift(-back), shift(-back)].slice(0, lv);
    });
    $('testBar').addEventListener('click', e => {
      const b = e.target.closest('[data-t]'); if (!b) return;
      const t = b.dataset.t, w1 = worldCards(0);
      if (t === 'day+1') S.testDays = (S.testDays || 0) + 1;
      else if (t === 'day+3') S.testDays = (S.testDays || 0) + 3;
      else if (t === 'day0') S.testDays = 0;
      else if (t === 'w1y') setLv(w1, 1, 1);
      else if (t === 'w1r') setLv(w1, 2, 3);
      else if (t === 'w1d') setLv(w1, 3, 0);
      else if (t === 'alld') setLv(CARDS, 3, 0);
      else if (t === 'reset') S = blank();
      save(); renderHome(); showDay();
    });
    const origRender = renderHome; renderHome = function () { origRender(); showDay(); };
  }

  boot();
})();
</script>
