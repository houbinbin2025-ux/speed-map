<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>空空数学岛 · 方块世界原型</title>
<style>
:root{--cave:#1b1d22;--ink:#ecebe4;--mute:#a9a79c;--panel:#2a2c32;--panel2:#363941;--grass:#6fae3a;--gold:#f2c14e;--dia:#5fd9e6;--red:#d9534a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--cave);color:var(--ink);font-family:"PingFang SC",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
canvas{display:block}.px{image-rendering:pixelated}
.btn{min-height:46px;padding:0 16px;background:var(--panel2);border:3px solid #000;box-shadow:inset 2px 2px 0 rgba(255,255,255,.14),inset -2px -2px 0 rgba(0,0,0,.3);font-weight:800;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:active{transform:translateY(1px)}.btn.main{background:var(--grass);color:#10140c}.btn.warn{background:var(--gold);color:#241a06}.btn[disabled]{opacity:.45;background:var(--panel2);color:var(--ink)}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
#hud{height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px;background:#14151a;border-bottom:3px solid #000;overflow:hidden}
#hud.off{display:none}
.res{display:flex;align-items:center;gap:3px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;min-height:38px}
.res img{width:22px;height:22px;background:#3a3d45;border-radius:2px}
.res em{display:none;font-style:normal;font-size:13px;color:var(--mute);font-weight:700}
#date{margin-left:auto;font-size:13px;color:var(--mute);white-space:nowrap}
#sunTxt{font-size:13px;font-weight:800;color:var(--gold);white-space:nowrap}
#demoBtn{min-height:34px;padding:0 10px;font-size:13px}
#stage{flex:1;position:relative;min-height:0}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hint{position:absolute;left:8px;top:8px;max-width:60%;background:rgba(20,21,26,.9);border:2px solid #000;padding:5px 10px;font-size:14px;font-weight:700;line-height:1.35;pointer-events:none}
#rail{position:absolute;right:8px;top:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;width:82px;justify-content:flex-end;pointer-events:none}
#rail .btn{width:100%;padding:0;font-size:15px;min-height:48px;pointer-events:auto;white-space:normal;line-height:1.1}
#start{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);min-height:58px;padding:0 26px;font-size:20px}
.page{position:absolute;inset:0;background:var(--cave);display:none;flex-direction:column}.page.on{display:flex}
.phead{height:50px;flex:none;display:flex;align-items:center;gap:10px;padding:0 10px;background:#14151a;border-bottom:3px solid #000;font-weight:900;font-size:18px}.phead .sp{flex:1}
.pbody{flex:1;min-height:0;overflow:auto;padding:10px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.pfoot{flex:none;padding:6px 10px;display:flex;gap:8px;background:#14151a;border-top:3px solid #000}.pfoot .btn{flex:1}
.modalwrap{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:30;padding:8px}.modalwrap.on{display:flex}
.modal{background:var(--panel);border:4px solid #000;box-shadow:inset 3px 3px 0 rgba(255,255,255,.1);padding:12px 16px;max-width:560px;width:100%;max-height:100%;overflow:auto;touch-action:pan-y}
.modal h2{font-size:20px;margin-bottom:6px}.modal p{font-size:15px;line-height:1.5;color:#d6d4c8}
.mact{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.mact .btn{flex:1}
#toast{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:#000;color:var(--gold);padding:6px 14px;font-weight:800;font-size:15px;z-index:40;display:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
/* 答题 */
.qwrap{flex:1;min-height:0;display:flex}
.qleft{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative;padding:6px;overflow:hidden}
#qtag{height:26px;font-size:14px;font-weight:800;color:var(--gold);display:flex;align-items:center;gap:4px}#qtag img{width:20px;height:20px}
.qtext{font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;max-width:100%}
#qans,#bossA{min-width:120px;height:62px;background:#000;border:3px solid #555;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;font-variant-numeric:tabular-nums;padding:0 10px;white-space:nowrap}
#qans.ok{border-color:var(--grass);color:var(--grass)}#qans.no{border-color:var(--red);color:var(--red)}
#qmine{width:min(190px,40vh);height:min(100px,21vh)}
#qore{position:absolute;left:8px;top:6px;display:flex;align-items:center;gap:4px;font-size:22px;font-weight:900}#qore img{width:26px;height:26px}
#qpause{position:absolute;right:8px;top:6px;min-height:40px;font-size:14px;padding:0 10px}
.pad{width:min(46vw,300px);flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:6px;background:#14151a;border-left:3px solid #000}
.pad button{background:var(--panel2);border:3px solid #000;font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;min-height:44px}.pad button:active{background:#555}
#qpick{display:none;gap:14px}#qpick button{width:150px;height:96px;background:var(--panel2);border:4px solid #000;font-size:46px;font-weight:900}
.bar{height:10px;background:#000;border:2px solid #000;width:100%}.bar i{display:block;height:100%;background:var(--grass)}
/* 工作台 / 图鉴 */
.tabs{display:flex;gap:6px}.tabs .btn{min-height:44px;font-size:15px;padding:0 12px}.tabs .btn.on{background:var(--gold);color:#241a06}
.note{font-size:14px;font-weight:700;color:var(--gold);margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{background:var(--panel);border:3px solid #000;padding:8px;display:flex;flex-direction:column;gap:5px;min-height:112px}
.card .ct{display:flex;align-items:center;gap:6px;font-weight:900;font-size:15px}.card .ct img{width:34px;height:34px;flex:none}
.card .cd{font-size:13px;color:var(--mute);line-height:1.35;flex:1}.card .btn{min-height:44px;font-size:14px}
.card .why{font-size:13px;font-weight:700;color:var(--gold);min-height:44px;display:flex;align-items:center}
.cost{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;font-weight:700}.cost span{display:flex;align-items:center;gap:2px}.cost img{width:18px;height:18px}.cost .lack{color:var(--red)}
.card.dark{background:#17181c}.card.dark .ct{color:var(--mute)}.card.on{outline:3px solid var(--gold);outline-offset:-3px}
/* 地块卡片 */
.bound{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:2px solid #000;font-size:15px;font-weight:700}
.dots{display:flex;gap:3px;margin-left:auto}.dots i{width:18px;height:18px;border:2px solid #000;background:#111;display:block}.dots i.d1{background:#d9d9d9}.dots i.d2{background:var(--gold)}.dots i.d3{background:var(--dia)}
.torches{display:flex;gap:2px;align-items:center;margin:4px 0}.torches img{width:22px;height:22px}.torches img.off{opacity:.2;filter:grayscale(1)}
/* 建造 */
#bwrap{flex:1;min-height:0;display:flex;gap:8px;padding:6px}#bcv{touch-action:none;flex:none;align-self:center}
#bside{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;min-height:0}
#bbar{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:5px;align-content:start;touch-action:pan-y}
.bk{height:60px;background:var(--panel);border:3px solid #000;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;position:relative}.bk img{width:26px;height:26px}.bk.on{outline:3px solid var(--gold);outline-offset:-3px}.bk b{position:absolute;right:3px;top:1px;font-size:12px}
#bsay{min-height:40px;font-size:13px;line-height:1.35;color:#d6d4c8;background:#14151a;padding:4px 8px;border:2px solid #000}
#sunRow{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--gold)}#sun{height:12px;background:#000;border:2px solid #000;flex:1}#sun i{display:block;height:100%;background:var(--gold)}
#bossBox{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:0;padding:6px;overflow:hidden}
#demo .btn{min-height:44px;font-size:14px;flex:1 1 44%}.demoL{font-size:13px;color:var(--mute);margin:6px 0 2px}
#rotate{position:fixed;inset:0;background:var(--cave);display:none;align-items:center;justify-content:center;font-size:26px;font-weight:900;z-index:99}
@media (orientation:portrait) and (max-width:700px){#rotate{display:flex}}
@media (max-height:400px){#hud{height:40px}.res{font-size:14px}.res img{width:20px;height:20px}#rail .btn{min-height:44px}#start{min-height:50px;font-size:18px}.phead{height:46px}#qans,#bossA{height:50px;font-size:30px}}
@media (min-width:900px) and (min-height:600px){#hint{font-size:16px}.res{font-size:17px}.res em{display:inline}.res img{width:26px;height:26px}#rail{width:100px}#rail .btn{font-size:17px;min-height:60px}.pad{width:360px}.grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="rotate">把设备横过来</div>
<div id="app">
  <div id="hud"></div>
  <div id="stage">
    <canvas id="map"></canvas>
    <div id="hint"></div>
    <div id="rail">
      <button class="btn warn" id="bBoss" style="display:none">挑战</button>
      <button class="btn" id="bHome">回家</button>
      <button class="btn" id="bWork">工作台</button>
      <button class="btn" id="bBook">图鉴</button>
    </div>
    <button class="btn main" id="start">开始今天的探险</button>

    <div class="page" id="pQ">
      <div class="bar" style="flex:none"><i id="qfill" style="width:0"></i></div>
      <div class="qwrap">
        <div class="qleft" id="qleft">
          <div id="qore"></div>
          <button class="btn" id="qpause">暂停</button>
          <div id="qtag"></div>
          <canvas id="qmine" class="px" width="80" height="42"></canvas>
          <div class="qtext" id="qtext"></div>
          <div id="qans"></div>
          <div id="qpick"></div>
        </div>
        <div class="pad" id="qright"></div>
      </div>
    </div>

    <div class="page" id="pEnd">
      <div class="phead">今天的探险结束</div>
      <div class="pbody" id="endBody"></div>
      <div class="pfoot"><button class="btn main" id="endGo"></button><button class="btn" id="endGem">去锻造</button></div>
    </div>

    <div class="page" id="pWork">
      <div class="phead"><span>工作台</span><span class="tabs" id="workTabs"></span><span class="sp"></span><button class="btn" id="workBack">回到世界</button></div>
      <div class="pbody"><div class="note" id="workNote"></div><div class="grid" id="workGrid"></div></div>
    </div>

    <div class="page" id="pBook">
      <div class="phead"><span>图鉴</span><span class="tabs" id="bookTabs"></span><span class="sp"></span><button class="btn" id="bookBack">回到世界</button></div>
      <div class="pbody"><div class="grid" id="bookGrid"></div></div>
    </div>

    <div class="page" id="pBuild">
      <div class="phead"><span id="bTitle">建造</span><span class="sp"></span><button class="btn" id="buildBack">回到世界</button></div>
      <div id="bwrap">
        <canvas id="bcv" class="px"></canvas>
        <div id="bside">
          <div id="sunRow"><span id="sunLeft"></span><div id="sun"><i id="sunI"></i></div></div>
          <div id="bsay"></div>
          <div id="bbar"></div>
        </div>
      </div>
    </div>

    <div class="page" id="pBoss">
      <div class="phead"><span id="bossName"></span><span class="sp"></span><button class="btn" id="bossLeave">结束挑战</button></div>
      <div class="qwrap">
        <div id="bossBox">
          <canvas id="bossCv" class="px" width="48" height="32" style="width:120px;height:80px"></canvas>
          <div class="bar" style="width:220px;flex:none"><i id="bossHp" style="width:100%;background:var(--red)"></i></div>
          <div class="qtext" id="bossQ"></div>
          <div id="bossA"></div>
        </div>
        <div class="pad" id="bossPad"></div>
      </div>
    </div>

    <div class="modalwrap" id="mw"><div class="modal" id="modal"></div></div>
    <div id="toast"></div>
  </div>
</div>
<script>/*WORLD_CORE*/</script>
<script>
'use strict';
const C = WORLDCORE, $ = id => document.getElementById(id), KEY = 'kongmath.v7proto3';
const PLOT = 8;
const addDays = (d, n) => new Date(Date.parse(d + 'T00:00:00Z') + n * 86400000).toISOString().slice(0, 10);
const short = d => +d.slice(5, 7) + ' 月 ' + +d.slice(8) + ' 日';

// 原型把一天压缩：10 题代表 10 分钟，每题矿石按真实一天折算（真实一天约 60 题，答对 1 题 1 块）。题少，工具门槛按比例缩小。真实产品用 v2 题库
const SESSION_Q = 10, NEW_MAX = 4, FAST_SEC = 8, BOSS_Q = 5, BOSS_PASS = 4, BOSS_HP = 10, ORE_SCALE = 5, DAY_SCALE = 6;
C.TOOLS.find(t => t.id === 'pick1').need = {iron: 20}; C.TOOLS.find(t => t.id === 'pick2').need = {gold: 30}; C.TOOLS.find(t => t.id === 'pick3').need = {diamond: 30};

const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const card = (id, a, op, b, level, group, fast) => ({id, name: `${a} ${op} ${b}`, gen: false, level, group, fast, make: () => ({text: `${a} ${op} ${b} =`, ans: op === '+' ? a + b : a - b})});
const gen = (id, name, level, group, f, fast) => ({id, name, gen: true, level, group, fast, make: f});
const cmp = (id, name, level, lo, hi) => ({id, name, gen: true, pick: true, level, group: 'cmp', make: () => { let a = ri(lo, hi), b = ri(lo, hi); while (a === b) b = ri(lo, hi); return {pick: [a, b], text: '哪个大', ans: Math.max(a, b)}; }});
const ITEMS = [
  card('c63', 6, '+', 3, 1, 'look'), card('c72', 7, '+', 2, 1, 'look'), card('c81', 8, '+', 1, 1, 'look'), card('c54', 5, '+', 4, 1, 'look'),
  cmp('cmp10', '10 以内谁大', 1, 1, 10),
  card('b62', 6, '+', 2, 2, 'bond', 1), card('b53', 5, '+', 3, 2, 'bond', 1), card('b83', 8, '−', 3, 2, 'bond', 1), card('b94', 9, '−', 4, 2, 'bond', 1), card('b72', 7, '−', 2, 2, 'bond', 1), card('b95', 9, '−', 5, 2, 'bond', 1),
  card('t64', 6, '+', 4, 3, 'bond', 1), card('t73', 7, '+', 3, 3, 'bond', 1), card('t82', 8, '+', 2, 3, 'bond', 1), card('t91', 9, '+', 1, 3, 'bond', 1), card('t103', 10, '−', 3, 3, 'bond', 1), card('t106', 10, '−', 6, 3, 'bond', 1), card('t107', 10, '−', 7, 3, 'bond', 1),
  gen('line10', '0—10 数线', 2, 'line', () => { const a = ri(2, 9); return {text: `${a - 1} 的下一个数`, ans: a}; }),
  gen('next', '接方块', 2, 'garden', () => { const a = ri(2, 6); return {text: `${a}，${a + 2}，${a + 4}，？`, ans: a + 6}; }),
  gen('hour', '整点', 3, 'market', () => { const a = ri(1, 9); return {text: `${a} 点过 2 小时是几点`, ans: a + 2}; }),
  gen('join', '装到一起', 3, 'dock', () => { const a = ri(2, 5), b = ri(2, 4); return {text: `${a} 箱加 ${b} 箱，共几箱`, ans: a + b}; }),
  gen('place1', '几个十几个一', 3, 'place', () => { const a = ri(1, 4), b = ri(1, 9); return {text: `${a} 个十 ${b} 个一`, ans: a * 10 + b}; }),
  card('p96', 9, '+', 6, 5, 'bond', 1), card('p87', 8, '+', 7, 5, 'bond', 1), card('p75', 7, '+', 5, 5, 'bond', 1), card('p68', 6, '+', 8, 5, 'bond', 1), card('p94', 9, '+', 4, 5, 'bond', 1), card('p76', 7, '+', 6, 5, 'bond', 1),
  card('m158', 15, '−', 8, 6, 'bond', 1), card('m137', 13, '−', 7, 6, 'bond', 1), card('m129', 12, '−', 9, 6, 'bond', 1), card('m146', 14, '−', 6, 6, 'bond', 1), card('m168', 16, '−', 8, 6, 'bond', 1),
  cmp('cmp20', '20 以内谁大', 4, 11, 20),
  gen('two', '两位数加一位数', 8, 'line', () => { const a = ri(21, 60), b = ri(1, 8); return {text: `${a} + ${b} =`, ans: a + b}; }, 1),
  gen('twoC', '进位加', 9, 'line', () => { const a = ri(25, 68), b = ri(5, 9); return {text: `${a} + ${b} =`, ans: a + b}; }, 1),
  gen('tt', '两位数加两位数', 10, 'bond', () => { const a = ri(11, 40), b = ri(11, 40); return {text: `${a} + ${b} =`, ans: a + b}; }, 1),
  gen('ttC', '进位退位', 11, 'bond', () => { const a = ri(25, 58), b = ri(16, 39); return {text: `${a} + ${b} =`, ans: a + b}; }, 1),
  gen('hun', '三位数', 12, 'place', () => { const a = ri(1, 9), b = ri(0, 9), c = ri(0, 9); return {text: `${a} 百 ${b} 十 ${c} 个`, ans: a * 100 + b * 10 + c}; }),
  gen('m25', '2、5、10 的乘法', 13, 'garden', () => { const a = [2, 5, 10][ri(0, 2)], b = ri(2, 9); return {text: `${a} × ${b} =`, ans: a * b}; }, 1),
  gen('m3', '表内乘法', 14, 'garden', () => { const a = ri(3, 9), b = ri(3, 9); return {text: `${a} × ${b} =`, ans: a * b}; }, 1),
  gen('d3', '表内除法', 15, 'garden', () => { const a = ri(3, 9), b = ri(3, 9); return {text: `${a * b} ÷ ${a} =`, ans: b}; }, 1),
];
const ITEM = Object.fromEntries(ITEMS.map(i => [i.id, i]));

function fresh() { return {day: '2026-11-06', W: C.blank(), seen: {}, wrongEver: {}, practiced: '', sunLeft: 0, sunTotal: 0, pet: null, skin: 'base', qs: null}; }
let G;
try { G = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch (e) { G = fresh(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(G)); } catch (e) {} };
const W = () => G.W;
const items = () => ITEMS.map(i => Object.assign({}, i, {seen: !!G.seen[i.id]}));
const isDay = () => G.practiced === G.day && G.sunLeft > 0;
const lit = () => C.skillsLit(W(), items());

// ---------- 像素图标 ----------
const P = {'.': null, k: '#1b1d22', w: '#c08a52', W: '#8a5a2c', s: '#9a9da4', S: '#6c6f76', i: '#d6d9df', I: '#9aa0a8', g: '#f2c14e', G: '#b98a22', d: '#5fd9e6', D: '#2f9fae', c: '#111', C: '#6a6a6a', f: '#ff9a2e', F: '#ffe27a', r: '#d9342b', o: '#fff'};
const SPR = {
  ore: ['................', '.....ssss.......', '...ssssssss.....', '..sssGssssSS....', '..ssGgGsssSS....', '.ssssGssssSSS...', '.sssssssGsSSS...', '.ssssssGgGSSS...', '..ssssssGSSS....', '...ssSSSSSS.....', '................'],
  wood: ['................', '....WWWWWWWW....', '...WwwwwwwwwW...', '...WwwWWWwwwW...', '...WwWwwwWwwW...', '...WwwWWWwwwW...', '...WwwwwwwwwW...', '....WWWWWWWW....', '................'],
  coal: ['................', '.....cccc.......', '...ccCccccc.....', '..cccccCcccc....', '..cCcccccccc....', '..cccccccCcc....', '...cccCccc......', '.....ccc........', '................'],
  iron: ['................', '................', '.....iiiiii.....', '....iiiiiiii....', '...iIIIIIIIIi...', '..iiiiiiiiiiii..', '..IIIIIIIIIIII..', '................'],
  gold: ['................', '................', '.....gggggg.....', '....ggggggGG....', '...gGGGGGGGGg...', '..gggggggggggg..', '..GGGGGGGGGGGG..', '................'],
  diamond: ['................', '....dddddddd....', '...dooddddddD...', '..dooddddddDDD..', '..ddddddddDDDD..', '...ddddddDDDD...', '....ddddDDDD....', '.....dddDDD.....', '......dDDD......', '.......DD.......', '................'],
  flag: ['...W............', '...Wrrrrrrr.....', '...Wrrrrrrrrr...', '...Wrrrrrrrr....', '...Wrrrrrr......', '...W............', '...W............', '...W............', '...W............', '..WWW...........'],

  });

  if (workTab === 'block') C.BLOCKS.forEach(b => {

  });
  $('workGrid').innerHTML = h;
  $('workGrid').querySelectorAll('[data-tool]').forEach(b => { b.onclick = () => { if (C.craftTool(w, b.dataset.tool, G.day)) { toast(C.TOOLS.find(t => t.id === b.dataset.tool).name + ' 合成完成'); digAll(); save(); hud(); renderWork(); } }; });
  $('workGrid').querySelectorAll('[data-block]').forEach(b => { b.onclick = () => { if (C.craftBlock(w, b.dataset.block, L)) { save(); hud(); renderWork(); } }; });
  const mk = $('mkFlag'); if (mk) mk.onclick = () => { if (C.craftFlag(w, C.flagRing(w))) { save(); hud(); renderWork(); } };
}
function digAll() { const w = W(), L = lit(); Object.values(w.plots).forEach(p => { if (!p.dug && p.st !== 'wild') { const f = C.feature(p.x, p.y); if (f && f.kind === 'vein') { const d = C.digPlot(w, p.x, p.y, L); if (d && d.ore) toast(`挖开矿脉：矿石 +${d.ore}`); } } }); }
$('bWork').onclick = () => openWork();
$('bHome').onclick = () => { cam = {x: 0, y: 0}; draw(); };

// ---------- 图鉴 ----------
let bookTab = 'pal';
$('bBook').onclick = () => { page('pBook'); renderBook(); };
$('bookBack').onclick = () => page(null);
function renderBook() {

  $('bookTabs').querySelectorAll('button').forEach(b => { b.onclick = () => { bookTab = b.dataset.t; renderBook(); }; });
  let h = '';
  const petImg = (p, on) => { const c = document.createElement('canvas'); c.width = 14; c.height = 10; sprite(c.getContext('2d'), BODY[p[3]], petPal(p[2], on), 2, 2, 1); return `<img class="px" src="${c.toDataURL()}" alt="">`; };
  const heroImg = (id, on) => { const c = document.createElement('canvas'); c.width = 12; c.height = 14; const s = SKINS[id]; sprite(c.getContext('2d'), HERO_ROWS, on ? {H: s[3], S: '#f1c27d', E: '#1b1d22', M: '#c0705a', G: s[0], g: s[1], B: s[2], K: '#2b2b2b'} : {H: '#0a0a0a', S: '#0a0a0a', E: '#0a0a0a', M: '#0a0a0a', G: '#0a0a0a', g: '#0a0a0a', B: '#0a0a0a', K: '#0a0a0a'}, 2, 0, 1); return `<img class="px" src="${c.toDataURL()}" alt="">`; };

  if (bookTab === 'boss') C.BANDS.forEach(b => { const on = w.boss[b.id];
    h += `<div class="card ${on ? '' : 'dark'}"><div class="ct">${on ? b.boss : '未打败'}</div><div class="cd">${b.name}${on ? ' · ' + short(on) + ' 打败' : ''}</div></div>`; });

  $('bookGrid').querySelectorAll('[data-pet]').forEach(b => { b.onclick = () => { G.pet = G.pet === b.dataset.pet ? null : b.dataset.pet; save(); renderBook(); }; });

}

// ---------- 建造 ----------
let B = null;
function openBuild(x, y) {
  if (!isDay()) return toast(G.practiced === G.day ? '夜晚不能建造。明天继续' : '今天探险后可以建造');
  B = {x, y, sel: null, cell: 0, base: null}; page('pBuild');
  $('bTitle').textContent = `建造 · ${C.bandOfRing(C.ring(x, y)).name}${W().plots[C.pkey(x, y)].st === 'temp' ? ' · 临时地块' : ''}`;
  requestAnimationFrame(() => { renderBuild(); });
}
function say(t) { $('bsay').textContent = t; }
function renderBuild() {
  const w = W(), hA = $('bwrap').clientHeight - 12, wA = $('bwrap').clientWidth * .55; if (!hA) return;
  B.cell = Math.max(24, Math.floor(Math.min(hA, wA) / PLOT));
  const c = $('bcv'); c.width = c.height = B.cell * PLOT; c.style.width = c.style.height = B.cell * PLOT + 'px';
  B.base = plotCanvas(B.x, B.y, B.cell, false); drawBuild();
  const own = C.BLOCKS.filter(b => (w.blocks[b.id] || 0) > 0);
  if (B.sel && B.sel !== 'x' && !own.some(b => b.id === B.sel)) B.sel = null;
  if (!B.sel && own.length) B.sel = own[0].id;
  $('bbar').innerHTML = `<button class="bk ${B.sel === 'x' ? 'on' : ''}" data-b="x"><span style="font-size:22px;font-weight:900">✕</span>拆除</button>` + own.map(b => `<button class="bk ${B.sel === b.id ? 'on' : ''}" data-b="${b.id}"><img class="px" src="${blockIcon(b.id)}" alt=""><b>${w.blocks[b.id]}</b>${b.name}</button>`).join('') + `<button class="bk" id="toWork"><span style="font-size:20px;font-weight:900">＋</span>合成</button>`;
  $('bbar').querySelectorAll('[data-b]').forEach(el => { el.onclick = () => { B.sel = el.dataset.b; say(B.sel === 'x' ? '点已放的方块拆除，方块退回' : C.BLOCKS.find(b => b.id === B.sel).name + '：点空格放下'); renderBuild(); }; });
  $('toWork').onclick = () => openWork('block', 'build');
  if (!own.length && !$('bsay').textContent) say('没有方块。点「合成」做一些');
  sunBar();
}
function sunBar() { $('sunI').style.width = Math.max(0, G.sunLeft / Math.max(1, G.sunTotal) * 100) + '%'; $('sunLeft').textContent = '白天 ' + fmtSun(); }
function drawBuild() {
  const g = $('bcv').getContext('2d'), s = B.cell; g.imageSmoothingEnabled = false; g.drawImage(B.base, 0, 0);
  const built = W().built[C.pkey(B.x, B.y)] || {};
  Object.entries(built).forEach(([k, v]) => { const [i, j] = k.split(',').map(Number); if (v.b === 'bridge' && v.up) { g.globalAlpha = .35; drawBlock(g, v.b, i * s, j * s, s, v); g.globalAlpha = 1; } else drawBlock(g, v.b, i * s, j * s, s, v); });
  g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = 1; for (let i = 0; i <= PLOT; i++) { g.beginPath(); g.moveTo(i * s + .5, 0); g.lineTo(i * s + .5, s * PLOT); g.moveTo(0, i * s + .5); g.lineTo(s * PLOT, i * s + .5); g.stroke(); }
}
$('bcv').addEventListener('click', e => {
  if (!B) return;
  const r = $('bcv').getBoundingClientRect(), i = Math.floor((e.clientX - r.left) / B.cell), j = Math.floor((e.clientY - r.top) / B.cell), w = W();
  if (i < 0 || j < 0 || i >= PLOT || j >= PLOT) return;
  if (G.sunLeft <= 0) return dusk();
  const pk = C.pkey(B.x, B.y), ck = i + ',' + j, m = w.built[pk] || (w.built[pk] = {}), cur = m[ck];
  if (B.sel === 'x') { if (cur) { C.unplace(w, B.x, B.y, i, j); say(C.BLOCKS.find(b => b.id === cur.b).name + ' 已退回'); save(); renderBuild(); } else say('这一格是空的'); return; }
  if (cur) {
    if (cur.b === 'lever') { Object.values(m).forEach(v => { if (v.b === 'bridge') v.up = !v.up; }); save(); drawBuild(); say('拉杆：吊桥收起或放下'); return; }
    if (cur.b === 'diamondb') { const it = ITEM[cur.from], pr = W().proof[cur.from]; say(cur.from ? `这块钻石来自 ${it ? it.name : cur.from}。${pr && pr.d3 ? short(pr.d3) + ' 隔天仍答对' : ''}` : '钻石块'); return; }
    if (cur.b === 'paint') { cur.open = !cur.open; save(); drawBuild(); say(cur.open ? '暗门画：门打开' : '暗门画：门关上'); return; }
    if (cur.b === 'trap') { say('陷阱：上面摆着诱饵钻石，踩上去会掉下去'); return; }
    say(C.BLOCKS.find(b => b.id === cur.b).name + '。要换先用拆除'); return;
  }
  if (!B.sel) { say('没有方块。点「合成」做一些'); return; }
  const v = C.place(w, B.x, B.y, i, j, B.sel, G.day); if (!v) return;
  if (v.b === 'diamondb') { const it = ITEM[v.from], pr = W().proof[v.from]; say(v.from ? `这块钻石来自 ${it ? it.name : v.from}。${pr && pr.d3 ? short(pr.d3) + ' 隔天仍答对' : ''}` : '钻石块'); } else say(C.BLOCKS.find(b => b.id === v.b).name + ' 已放下');
  save(); renderBuild();
});
$('buildBack').onclick = () => page(null);
function dusk() {
  if (pageNow === 'pBuild' || pageNow === 'pWork') page(null);
  modal(`<h2>天黑了</h2><p>今天的世界时间结束。盖好的东西都存着，明天探险后天亮。</p>`, [{t: '查看世界', c: 'main'}, {t: '关闭'}]);
}

// ---------- Boss ----------
let BS = null;
function openBoss(bi) {
  if (!C.bossCanTry(W(), bi, items(), G.day)) return toast('这一带的题学会更多后可以挑战');
  const band = C.BANDS[bi];
  BS = {bi, band, pool: C.bossPool(W(), band, items()), i: 0, ok: 0, input: ''};
  W().bossDay = G.day; save();
  $('bossName').textContent = band.boss; buildPad($('bossPad'), bossDigit); page('pBoss'); bossQ();
}
$('bBoss').onclick = () => { const bi = C.BANDS.findIndex((x, i) => C.bossCanTry(W(), i, items(), G.day)); if (bi >= 0) modal(`<h2>挑战${C.BANDS[bi].boss}</h2><p>今天只能挑战一次，开始后中途结束也算一次。打中的次数累计，血量不回。</p>`, [{t: '开始挑战', c: 'warn', f: () => openBoss(bi)}, {t: '先不挑战'}]); };
function drawBoss(hit) {
  const g = $('bossCv').getContext('2d'); g.clearRect(0, 0, 48, 32);
  const col = {meadow: ['#6c7a4a', '#3d7524'], pine: ['#6b4628', '#3d7524'], sand: ['#c97a3e', '#8a4e22'], frost: ['#dfe9f2', '#8fa9c0'], lava: ['#4a2c26', '#ff7a1f'], cloud: ['#7f8fa8', '#f2c14e']}[BS.band.id], o = hit ? 2 : 0;
  g.fillStyle = col[0]; g.fillRect(12 + o, 8, 24, 20); g.fillRect(16 + o, 2, 16, 8); g.fillStyle = col[1]; g.fillRect(12 + o, 8, 24, 3); g.fillRect(8 + o, 12, 4, 12); g.fillRect(36 + o, 12, 4, 12);
  g.fillStyle = '#000'; g.fillRect(19 + o, 5, 3, 2); g.fillRect(26 + o, 5, 3, 2); g.fillRect(14 + o, 28, 6, 3); g.fillRect(28 + o, 28, 6, 3);
}
function bossBar() { const had = W().bossHp[BS.band.id] || 0; $('bossHp').style.width = Math.max(0, 1 - Math.max(BS.ok / BOSS_PASS, (had + BS.ok) / BOSS_HP)) * 100 + '%'; }
function bossQ() {
  if (!BS) return;
  if (BS.i >= BOSS_Q) return bossEnd();
  const it = BS.pool[Math.floor(Math.random() * BS.pool.length)]; let q = it.make();
  if (q.pick) q = {text: `${q.pick[0]} 和 ${q.pick[1]} 哪个大`, ans: q.ans};
  BS.q = q; BS.input = ''; BS.lock = false;
  $('bossQ').textContent = q.text; fitText($('bossQ')); $('bossQ').style.fontSize = Math.min(44, parseInt($('bossQ').style.fontSize)) + 'px';
  $('bossA').textContent = ''; $('bossA').style.borderColor = '#555';
  bossBar(); drawBoss();
}
function bossDigit(d) {
  if (!BS || BS.lock) return;
  if (d === '⌫') BS.input = BS.input.slice(0, -1); else if (d === '确定') { if (BS.input) bossAns(); return; } else if (BS.input.length < 4) BS.input += d;
  $('bossA').textContent = BS.input;
  if (BS.input.length === String(BS.q.ans).length) bossAns();
}
function bossAns() {
  BS.lock = true; const ok = +BS.input === BS.q.ans; if (ok) { BS.ok++; drawBoss(true); }
  $('bossA').style.borderColor = ok ? 'var(--grass)' : 'var(--red)'; if (!ok) $('bossA').textContent = `${BS.input} → ${BS.q.ans}`;
  bossBar(); BS.i++;
  const mine = BS; setTimeout(() => { if (BS === mine) bossQ(); }, ok ? 380 : 1100);
}
function bossEnd() {
  const s = BS; BS = null; const win = C.bossEnd(W(), s.bi, s.ok, G.day, BOSS_PASS, BOSS_HP), nx = C.BANDS[s.bi + 1];
  save(); page(null);
  modal(win ? `<h2>打败${s.band.boss}</h2><p>掉落：金块 ×6。地图向外开放${nx ? `：${nx.name}` : ''}。</p>` : `<h2>${s.band.boss}未被打败</h2><p>这次打中 ${s.ok} 下，累计 ${W().bossHp[s.band.id]} / ${BOSS_HP}。血量不回，明天接着打。</p>`, [{t: '回到世界', c: 'main'}]);
  hud();
}
$('bossLeave').onclick = () => { if (BS) { BS.i = BOSS_Q; bossEnd(); } };

// ---------- 白天倒计时：切后台不走 ----------
let lastT = performance.now(), warned = false;
document.addEventListener('visibilitychange', () => { lastT = performance.now(); if (Q) Q.t0 = performance.now(); save(); });
setInterval(() => {
  const now = performance.now(), dt = (now - lastT) / 1000; lastT = now;
  if (document.hidden || G.practiced !== G.day || G.sunLeft <= 0) return;
  if (pageNow === 'pQ' || pageNow === 'pEnd' || pageNow === 'pBoss') return;
  G.sunLeft -= dt;
  if (pageNow === 'pBuild') sunBar();
  const st = $('sunTxt'); if (st) st.textContent = '白天 ' + fmtSun();
  if (G.sunLeft <= 30 && G.sunLeft > 0 && !warned) { warned = true; toast('还有 30 秒天黑'); }
  if (G.sunLeft <= 0) { G.sunLeft = 0; warned = false; save(); dusk(); hud(); }
}, 1000);
setInterval(save, 5000);

// ---------- 演示控制（只在原型里有）：快进日期 ----------
function autoDay(rate) {
  const w = W(), list = pickSession(), sum = {ev: [], ok: 0, n: 0};
  list.forEach(({id}) => { const it = ITEM[id], ok = Math.random() < rate, res = C.onAttempt(w, it, {ok, fast: ok, needFast: !!it.fast}, G.day);
    G.seen[id] = 1; sum.n++; if (ok) { sum.ok++; C.gain(w, 'ore', ORE_SCALE); } else G.wrongEver[id] = 1; sum.ev.push(...res.events); });
  return sum;
}
function nextDay(mode, n) {
  const ev = [];
  Q = null; BS = null; G.qs = null;
  for (let d = 0; d < (n || 1); d++) {
    G.day = addDays(G.day, 1); G.sunLeft = 0;
    if (mode === 'none') continue;
    const sum = autoDay(mode === 'good' ? 1 : mode === 'mid' ? .75 : 0), wild = C.endOfPractice(W(), G.day), pr = C.pruneBound(W(), items(), G.day);
    startDay(sum.ok, sum.n);
    sum.ev.concat(wild, pr).forEach(e => ev.push(e.type));
    // 快进时自动花掉一部分：合成工具
    C.TOOLS.forEach(t => C.craftTool(W(), t.id, G.day));
  }
  save(); page(null);
  const c = t => ev.filter(x => x === t).length;
  const parts = [c('perm') && `${c('perm')} 块变永久`, c('back') && `${c('back')} 块回来`, c('wild') && `${c('wild')} 块被迷雾盖住`, c('ench') && `${c('ench')} 块附魔`].filter(Boolean);
  toast(`${short(G.day)} · ${parts.join('，') || (mode === 'none' ? '没来的日子，火把不烧' : '地块没有变化')}`, 3000);
}
function demoPanel() {
  modal(`<h2>演示控制（只给家长看）</h2><div id="demo">
    <div class="demoL">下一天，自己答题</div><div class="mact" style="margin:0"><button class="btn main" data-d="self">下一天 · 自己答</button></div>
    <div class="demoL">快进（自动答 10 题，矿石按真实一天折算）</div><div class="mact" style="margin:0"><button class="btn" data-d="good,1">1 天 · 全对</button><button class="btn" data-d="good,5">5 天 · 全对</button><button class="btn" data-d="mid,1">1 天 · 有错</button><button class="btn" data-d="bad,1">1 天 · 全错</button></div>
    <div class="demoL">没来</div><div class="mact" style="margin:0"><button class="btn" data-d="none,1">1 天没来</button><button class="btn" data-d="none,14">14 天没来</button></div>
    <div class="demoL">其他</div><div class="mact" style="margin:0"><button class="btn" data-d="dusk">现在天黑</button><button class="btn" data-d="rich">材料各加 200</button><button class="btn" data-d="reset">重新开始</button></div>
  </div>`, [{t: '关闭'}]);
  $('modal').querySelectorAll('[data-d]').forEach(b => { b.onclick = () => {
    closeModal(); const [m, n] = b.dataset.d.split(',');
    if (m === 'reset') return modal('<h2>重新开始？</h2><p>原型里的进度全部清空。不影响真实产品。</p>', [{t: '清空', c: 'warn', f: () => { G = fresh(); thumbs = {}; Q = null; BS = null; save(); cam = {x: 0, y: 0}; page(null); }}, {t: '取消'}]);
    if (m === 'self') { Q = null; BS = null; G.qs = null; G.day = addDays(G.day, 1); G.sunLeft = 0; save(); return page(null); }

    if (m === 'rich') { ['ore', 'wood', 'coal', 'iron', 'gold', 'diamond'].forEach(k => C.gain(W(), k, 200)); save(); return hud(); }

  }; });
}
addEventListener('resize', () => { resize(); if (pageNow === 'pBuild') renderBuild(); if (Q) fitText($('qtext')); });
resize(); page(null);
window.__G = () => G; window.__C = C; window.__ITEMS = ITEMS; window.__itemsNow = items; window.__plotPx = plotPx; window.__cam = () => cam; window.__curAns = () => (Q && Q.cur ? Q.cur.inst.ans : null); window.__renderBuild = () => renderBuild(); window.__openBoss = openBoss; window.__bossAns = () => (BS && BS.q ? BS.q.ans : null);
</script>
