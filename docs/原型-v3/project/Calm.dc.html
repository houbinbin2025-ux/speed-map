<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ecebe4;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 932px; height: 430px; box-sizing: border-box; background: #1b1d22; color: #ecebe4; font-family: 'PingFang SC', system-ui, sans-serif; padding: 10px 60px 18px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; position: relative">
  <div style="display: flex; align-items: center; gap: 12px">

  </div>
  <div style="display: flex; align-items: center; gap: 12px"><span style="background: #2a2d34; border: 2px solid #000; padding: 3px 10px; font-size: 14px; font-weight: 700">比大小 · 20 以内</span><span style="font-size: 20px; font-weight: 900">哪个大？点它</span></div>
  <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; opacity: 0.35">

  </div>
