<helmet>

<div style="width: 932px; height: 430px; box-sizing: border-box; background: #1b1d22; color: #ecebe4; font-family: 'PingFang SC', system-ui, sans-serif; padding: 12px 60px 14px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">

      <div style="display: flex; align-items: flex-end; gap: 6px; height: 90px" aria-label="最近 7 天每天练习分钟数">
        <i style="flex: 1; height: 100%; background: #6fae3a"></i><i style="flex: 1; height: 95%; background: #6fae3a"></i><i style="flex: 1; height: 0%; background: #6fae3a"></i><i style="flex: 1; height: 100%; background: #6fae3a"></i><i style="flex: 1; height: 60%; background: #6fae3a"></i><i style="flex: 1; height: 100%; background: #6fae3a"></i><i style="flex: 1; height: 100%; background: #6fae3a"></i>

    </div>
    <div style="background: #2a2d34; border: 2px solid #000; padding: 12px; display: flex; flex-direction: column; gap: 8px">
      <b style="font-size: 15px">练习设置</b>
      <span style="font-size: 13px; color: #b8bac3">看数的图片显示多久</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
        <button type="button" style="height: 44px; background: #1b1d22; color: #b8bac3; border: 2px solid #000; font: inherit; font-size: 14px">1 秒</button>
        <button type="button" style="height: 44px; background: #ecebe4; color: #1b1d22; border: 2px solid #000; font: inherit; font-size: 14px; font-weight: 900">1.5 秒</button>
        <button type="button" style="height: 44px; background: #1b1d22; color: #b8bac3; border: 2px solid #000; font: inherit; font-size: 14px">2.5 秒</button>
      </div>
      <span style="font-size: 13px; color: #b8bac3">数线 0—100：差多少算对（最近 20 题平均差 6）</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
        <button type="button" style="height: 44px; background: #1b1d22; color: #b8bac3; border: 2px solid #000; font: inherit; font-size: 14px; white-space: nowrap">差 5</button>
        <button type="button" style="height: 44px; background: #ecebe4; color: #1b1d22; border: 2px solid #000; font: inherit; font-size: 14px; font-weight: 900; white-space: nowrap">差 10</button>
        <button type="button" style="height: 44px; background: #1b1d22; color: #b8bac3; border: 2px solid #000; font: inherit; font-size: 14px; white-space: nowrap">差 15</button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; margin-top: auto">
        <a href="PlaceIntro.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; background: #1b1d22; border: 2px solid #000; font-size: 14px">重新摸底</a>
        <a href="Parent.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; background: #1b1d22; border: 2px solid #000; font-size: 14px">重新校准笔迹</a>
      </div>
    </div>
    <div style="background: #2a2d34; border: 2px solid #000; padding: 12px; display: flex; flex-direction: column; gap: 8px">
      <b style="font-size: 15px">进度安全</b>
      <div style="font-size: 13px; line-height: 1.6; color: #b8bac3">上次备份：<span style="color: #f2c14e">9 天前</span><br>长期保存：已获准<br>占用空间：86 KB<br>请不要在无痕模式下用</div>
      <a href="Parent.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; background: #1b1d22; border: 2px solid #000; font-size: 14px">导出进度（复制到备忘录）</a>
      <a href="Parent.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; background: #1b1d22; border: 2px solid #000; font-size: 14px">导入进度（按格子取高合并）</a>
      <div style="font-size: 12px; color: #9a9ca6; margin-top: auto">清空进度、整份替换在最下面折叠里</div>
    </div>
  </div>
</div>
