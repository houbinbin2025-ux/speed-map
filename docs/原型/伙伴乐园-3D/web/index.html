<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小伙伴乐园</title>
<style>
:root{--card:rgba(250,248,241,.93);--ink:#2b2a27;--mute:#7c776d;--line:rgba(60,50,30,.10);--ok:#4caf50;--want:#f0a23a;--wilt:#9aa0a6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe4f2;font-family:"PingFang SC","Hiragino Sans GB",system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
.card{position:fixed;background:var(--card);border-radius:18px;box-shadow:0 6px 24px rgba(40,50,30,.12);border:1px solid rgba(255,255,255,.6)}
#title{left:16px;top:14px;padding:10px 16px 10px 14px;display:flex;gap:10px;align-items:center}
#title b{font-size:20px;display:block}#title small{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:5px}
#title small i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
#stats{left:50%;transform:translateX(-50%);top:14px;display:flex;gap:6px;padding:8px 10px}
#stats div{min-width:76px;padding:2px 10px;text-align:left}
#stats b{display:block;font-size:30px;line-height:1.05;font-weight:700;font-variant-numeric:tabular-nums}
#stats span{font-size:13px;color:var(--mute)}
#clock{right:16px;top:14px;padding:8px 16px;text-align:right}
#clock b{font-size:32px;font-weight:800;line-height:1.05;display:block;font-variant-numeric:tabular-nums}
#clock span{font-size:13px;color:var(--mute);display:block}
#panel{left:16px;top:100px;width:240px;padding:14px 16px}
#panel h3{margin:0 0 2px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
#panel .st{font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:#e6f4e4;color:#2f7d32}
#panel .st.wilt{background:#eceeef;color:#6b7075}#panel .st.want{background:#fdf0dc;color:#a8650f}
#panel p{margin:0 0 10px;font-size:13px;color:var(--mute);line-height:1.5}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.bar .cells{display:flex;gap:3px;flex:1}.bar .cells i{flex:1;height:10px;border-radius:3px;background:#e3dfd4}
.bar .cells.f i.on{background:#e3a35a}.bar .cells.w i.on{background:#5cb7e6}
.acts{display:flex;gap:8px;margin-top:12px}
.acts button,#tools button{font:inherit;cursor:pointer;border:0;background:#fff;color:var(--ink);border-radius:14px;box-shadow:0 2px 8px rgba(40,50,30,.12)}
.acts button{flex:1;min-height:48px;font-size:17px;font-weight:700}
.acts button.food{background:#ffe2b8}.acts button.water{background:#cdebfb}
.acts button:active,#tools button:active{transform:scale(.96)}
#tools{left:50%;transform:translateX(-50%);bottom:14px;display:flex;gap:8px;padding:8px}
#tools button{width:64px;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px}
#tools svg{width:22px;height:22px;stroke:#3a3833;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pill{position:fixed;transform:translate(-50%,-100%);background:rgba(255,253,246,.96);border-radius:999px;padding:6px 14px 6px 11px;font-size:16px;font-weight:800;white-space:nowrap;box-shadow:0 3px 12px rgba(40,50,30,.18);display:flex;align-items:center;gap:7px;pointer-events:none}
.pill i{width:10px;height:10px;border-radius:50%;background:var(--ok)}.pill small{font-weight:600;color:var(--mute);font-size:14px}
.pill.wilt i{background:var(--wilt)}.pill.want i{background:var(--want)}
.pill::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:26px;background:rgba(255,253,246,.9)}
#hud{position:fixed;right:16px;bottom:16px;font-size:11px;color:rgba(40,40,40,.55)}
@media (max-width:820px){#panel{top:auto;bottom:90px;width:auto;right:16px}#stats div{min-width:58px}#stats b{font-size:24px}#title b{font-size:17px}#clock b{font-size:26px}#tools button{width:52px;height:54px}}
@media (max-height:500px){#panel{top:auto;bottom:84px;left:16px;width:230px;padding:10px 12px}#panel p{display:none}#stats{display:none}#tools button{height:48px}}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/jsm/"}}</script>
</head>
<body>
<div class="card" id="title"><div><b>小伙伴乐园</b><small><i></i>空空的岛 · 1 位住户</small></div></div>
<div class="card" id="stats"><div><b id="sN">1</b><span>住户</span></div><div><b id="sH">1</b><span>开心</span></div><div><b id="sF">6</b><span>粮仓</span></div><div><b id="sW">6</b><span>水桶</span></div></div>
<div class="card" id="clock"><b id="cT">--:--</b><span id="cD"></span></div>
<div class="card" id="panel">
  <h3>小狼 <span class="st" id="pSt">开心</span></h3>
  <p>红围巾是它的记号，耳朵一竖就是听见你了</p>
  <div class="bar">食盆<div class="cells f" id="bF"></div></div>
  <div class="bar">水槽<div class="cells w" id="bW"></div></div>
  <div class="acts"><button class="food" id="aF">倒粮</button><button class="water" id="aW">倒水</button></div>
</div>
<div class="card" id="tools">
  <button id="tHome"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>全景</button>
  <button id="tL"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v5h5"/></svg>左转</button>
  <button id="tR"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>右转</button>
  <button id="tIn"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5M11 8v6M8 11h6"/></svg>拉近</button>
  <button id="tOut"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5M8 11h6"/></svg>拉远</button>
  <button id="tTag"><svg viewBox="0 0 24 24"><path d="M4 6h11l5 6-5 6H4z"/></svg>名牌</button>
</div>
<div class="pill" id="pill"><i></i>小狼 <small id="pillS">开心</small></div>
<div id="hud"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
