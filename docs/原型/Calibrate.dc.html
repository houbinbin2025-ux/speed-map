<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>笔迹校准</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ecebe4;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 932px; height: 430px; box-sizing: border-box; background: #1b1d22; color: #ecebe4; font-family: 'PingFang SC', system-ui, sans-serif; padding: 12px 60px 14px; display: flex; gap: 16px; overflow: hidden">
  <div style="width: 330px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="Main.dc.html" style="background: #2a2d34; border: 2px solid #000; height: 44px; display: flex; align-items: center; padding: 0 14px; font-size: 15px; font-weight: 700">返回</a>
      <span style="font-size: 14px; color: #b8bac3">第一次用手写，先认识一下你的字</span>
    </div>
    <div style="font-size: 26px; font-weight: 900; line-height: 1.3">教我认识<br>你写的数字</div>
    <div style="display: flex; align-items: baseline; gap: 12px">
      <span style="font-size: 20px; font-weight: 700">请写</span>
      <span style="font-family: Nunito, sans-serif; font-size: 110px; font-weight: 900; line-height: 1; color: #f2c14e">3</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; font-size: 15px">
      <span>第 2 遍，共 3 遍</span>
      <span style="width: 16px; height: 16px; background: #7bd88f; border: 2px solid #000"></span>
      <span style="width: 16px; height: 16px; background: #ecebe4; border: 2px solid #000"></span>
      <span style="width: 16px; height: 16px; background: #3a3e47; border: 2px solid #000"></span>
    </div>
    <div style="flex-grow: 1"></div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; font-size: 13px; color: #b8bac3"><span>0 到 9 每个写 3 遍</span><span>已写 10 / 30</span></div>
      <div style="height: 14px; background: #2a2d34; border: 2px solid #000"><div style="width: 33%; height: 100%; background: #3d7524"></div></div>
      <div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px; font-family: Nunito, sans-serif; font-weight: 900; font-size: 14px; text-align: center">
        <span style="background: #3d7524; color: #fff; border: 2px solid #000">0</span><span style="background: #3d7524; color: #fff; border: 2px solid #000">1</span><span style="background: #3d7524; color: #fff; border: 2px solid #000">2</span><span style="background: #ecebe4; color: #1b1d22; border: 2px solid #000">3</span><span style="background: #3a3e47; color: #b8bac3; border: 2px solid #000">4</span><span style="background: #3a3e47; color: #b8bac3; border: 2px solid #000">5</span><span style="background: #3a3e47; color: #b8bac3; border: 2px solid #000">6</span><span style="background: #3a3e47; color: #b8bac3; border: 2px solid #000">7</span><span style="background: #3a3e47; color: #b8bac3; border: 2px solid #000">8</span><span style="background: #3a3e47; color: #b8bac3; border: 2px solid #000">9</span>
      </div>
    </div>
  </div>
  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px">
    <div style="flex-grow: 1; position: relative; background-color: #f4ecd8; background-image: linear-gradient(#e3d7b9 1px, transparent 1px); background-size: 100% 48px; border: 3px solid #000; border-radius: 10px; overflow: hidden">
      <svg width="100%" height="100%" viewBox="0 0 500 340" role="img" aria-label="孩子写的数字 3 的笔迹">
        <path d="M205 105 C230 78 292 82 290 122 C288 150 255 160 238 165 C268 166 300 182 298 222 C295 268 228 280 196 248" fill="none" stroke="#2b2b2b" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <div style="position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 14px; color: #6b5e3c">像平时一样写，不用特别慢 · 写完停一下会自动记下来</div>
    </div>
    <div style="display: flex; gap: 10px; justify-content: flex-end">
      <a href="Calibrate.dc.html" style="min-width: 96px; height: 56px; display: flex; align-items: center; justify-content: center; background: #2a2d34; border: 3px solid #000; font-size: 17px; font-weight: 900">擦掉</a>
      <a href="Play.dc.html" style="min-width: 150px; height: 52px; display: flex; align-items: center; justify-content: center; background: #3a3e47; border: 3px solid #000; font-size: 15px; font-weight: 700; color: #b8bac3">（原型）跳到写完</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":932,"height":430}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
