<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>错题本</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ecebe4;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 932px; height: 430px; box-sizing: border-box; background: #1b1d22; color: #ecebe4; font-family: 'PingFang SC', system-ui, sans-serif; padding: 10px 60px 14px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Main.dc.html" style="background: #2a2d34; border: 2px solid #000; height: 44px; display: flex; align-items: center; padding: 0 14px; font-size: 15px; font-weight: 700">返回地图</a>
    <span style="font-size: 22px; font-weight: 900">错题本</span>
    <span style="flex-grow: 1"></span>
    <span style="font-size: 16px">今天要复习 <b style="font-family: Nunito, sans-serif; font-size: 22px; color: #f2c14e">3</b> 道</span>
    <a href="Play.dc.html" style="min-width: 150px; height: 50px; display: flex; align-items: center; justify-content: center; background: #3d7524; color: #ffffff; border: 3px solid #000; font-size: 19px; font-weight: 900">现在复习</a>
  </div>
  <div style="font-size: 13px; color: #b8bac3">写错的题会隔 1、2、4、7、15 天回来，每次都写对，就过 1 关；过完 5 关就算真的会了。平时练习也会自动带上它们。</div>
  <div style="flex-grow: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
    <div style="background: #2a2d34; border: 2px solid #000; padding: 10px; display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 16px; font-weight: 900">今天要复习 · 3</div>
      <sc-for list="{{due}}" as="m" hint-placeholder-count="3">
        <div style="background: #3a3e47; border: 2px solid #000; padding: 8px 10px; display: flex; align-items: center; gap: 8px">
          <span style="font-family: Nunito, sans-serif; font-weight: 900; font-size: 22px; flex-grow: 1">{{m.q}}</span>
          <span style="font-size: 13px; color: #f2c14e">{{m.note}}</span>
        </div>
      </sc-for>
    </div>
    <div style="background: #2a2d34; border: 2px solid #000; padding: 10px; display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 16px; font-weight: 900">过关中 · 4</div>
      <sc-for list="{{doing}}" as="m" hint-placeholder-count="4">
        <div style="background: #3a3e47; border: 2px solid #000; padding: 6px 10px; display: flex; align-items: center; gap: 8px">
          <span style="font-family: Nunito, sans-serif; font-weight: 900; font-size: 18px; width: 70px">{{m.q}}</span>
          <span style="display: flex; gap: 3px; flex-grow: 1">
            <sc-for list="{{m.dots}}" as="d" hint-placeholder-count="5"><span style="{{d.style}}"></span></sc-for>
          </span>
          <span style="font-size: 12px; color: #b8bac3; white-space: nowrap">{{m.when}}</span>
        </div>
      </sc-for>
    </div>
    <div style="background: #2a2d34; border: 2px solid #000; padding: 10px; display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 16px; font-weight: 900">已经会了 · 8</div>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <sc-for list="{{done}}" as="q" hint-placeholder-count="8">
          <span style="width: 64px; height: 30px; display: flex; align-items: center; justify-content: center; background: #b3261e; color: #ffffff; border: 2px solid #000; font-family: Nunito, sans-serif; font-weight: 900; font-size: 14px">{{q}}</span>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":932,"height":430}}'>
class Component extends DCLogic {
  renderVals() {
    const on = 'width: 12px; height: 12px; background: #7bd88f; border: 2px solid #000;';
    const off = 'width: 12px; height: 12px; background: #1b1d22; border: 2px solid #000;';
    const dots = (n) => [0, 1, 2, 3, 4].map((i) => ({ style: i < n ? on : off }));
    return {
      due: [{ q: '7 + 6', note: '昨天写错' }, { q: '13 − 8', note: '第 2 关' }, { q: '9 + 4', note: '第 3 关' }],
      doing: [
        { q: '5 + 2', dots: dots(1), when: '明天' },
        { q: '12 − 5', dots: dots(2), when: '3 天后' },
        { q: '8 + 7', dots: dots(3), when: '5 天后' },
        { q: '6 + 6', dots: dots(4), when: '12 天后' }
      ],
      done: ['4+3', '6−4', '9+2', '7−5', '8+3', '3+5', '11−3', '9+9']
    };
  }
}
</script>
</body>
</html>
