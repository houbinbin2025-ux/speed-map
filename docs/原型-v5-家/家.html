<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>空空的家 · 原型</title>
<style>
:root{--ink:#ecebe4;--dim:#b9b6a8;--panel:#23262c;--panel2:#31353c;--ok:#7bd88f;--warn:#f2c14e;--bad:#f6a5a0;--line:#000}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#1b1d22;color:var(--ink);font-family:"PingFang SC",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
canvas{image-rendering:pixelated;display:block}
button{font:inherit;color:inherit;cursor:pointer}
.scr{position:fixed;inset:0;overflow:hidden}.scr[hidden]{display:none}
.btn{min-height:44px;padding:0 14px;background:var(--panel2);border:3px solid #000;box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),inset 3px 3px 0 rgba(255,255,255,.08);font-size:16px;font-weight:800;white-space:nowrap}
.btn:active{transform:translateY(2px)}
.go{background:#6fae3a;color:#10140c;font-size:18px;min-height:52px}
/* 岛上 */
#isl canvas{position:absolute;inset:0;width:100%;height:100%}
#doorHit{position:absolute;background:none;border:0;padding:0}
.newsign{position:absolute;background:var(--warn);color:#10140c;border:3px solid #000;padding:4px 10px;font-weight:900;font-size:16px;white-space:nowrap;animation:bob 1s infinite steps(2)}
@keyframes bob{50%{transform:translateY(-5px)}}
.isltip{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(27,29,34,.9);border:3px solid #000;padding:8px 14px;font-size:16px;font-weight:700;white-space:nowrap}
/* 屋内 */
#vp{position:absolute;inset:0;touch-action:none;background:#2a1d12}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#world canvas{position:absolute;left:0;top:0}
.hud{position:absolute;top:calc(6px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));right:calc(8px + env(safe-area-inset-right));display:flex;gap:8px;align-items:center;pointer-events:none}
.hud>*{pointer-events:auto}.hud .sp{flex:1;pointer-events:none}
.tally{display:flex;gap:10px;align-items:center;background:rgba(27,29,34,.88);border:3px solid #000;padding:0 10px;height:44px;font-weight:800;font-size:15px}
.tally b{font-size:19px;color:var(--warn)}
.nav{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(6px + env(safe-area-inset-bottom));display:flex;gap:4px;background:rgba(27,29,34,.88);border:3px solid #000;padding:3px}
.nav button{height:40px;min-width:62px;padding:0 8px;background:var(--panel2);border:0;font-size:14px;font-weight:800;white-space:nowrap}
.nav button.on{background:var(--warn);color:#10140c}
.toast{position:absolute;left:50%;top:60px;transform:translateX(-50%);background:var(--panel);border:3px solid #000;padding:8px 14px;font-weight:800;font-size:15px;white-space:nowrap}
.toast[hidden]{display:none}
/* 右侧卡片 */
.sheet{position:absolute;top:0;bottom:0;right:0;width:min(46%,380px);background:var(--panel);border-left:4px solid #000;display:flex;flex-direction:column;gap:10px;padding:12px calc(14px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) 14px;transform:translateX(102%);transition:transform .18s ease-out;overflow-y:auto}
.sheet.on{transform:none}
.sh-h{display:flex;align-items:center;gap:10px}.sh-h canvas{width:64px;height:64px;background:#17191d;border:3px solid #000;flex:none}
.sh-h h2{margin:0;font-size:21px;line-height:1.2;flex:1}.sh-x{width:44px;height:44px;flex:none;background:var(--panel2);border:3px solid #000;font-size:20px;font-weight:900}
.sh-b{font-size:15px;line-height:1.55;color:var(--ink)}.muted{color:var(--dim);font-size:14px}
.barw{height:14px;background:#111;border:2px solid #000}.barw i{display:block;height:100%;background:var(--ok)}
.sh-f{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.rows{display:flex;flex-direction:column;gap:6px}.row{display:flex;align-items:center;gap:8px;background:var(--panel2);border:2px solid #000;padding:6px 8px;font-size:14px;font-weight:700;line-height:1.3;text-align:left;width:100%}
.row canvas{width:32px;height:32px;flex:none}.row span{flex:1}.row em{font-style:normal;color:var(--warn);font-weight:900;white-space:nowrap}
.ore3{display:grid;grid-template-columns:1fr;gap:6px}
.medals{display:grid;grid-template-columns:1fr auto auto;gap:4px 8px;font-size:14px;align-items:center}
.md{width:18px;height:18px;border:2px solid #000;display:block}
/* 奖状 */
#certV{position:absolute;inset:0;background:rgba(10,10,12,.88);display:flex;align-items:center;justify-content:center;gap:12px;padding:8px calc(10px + env(safe-area-inset-right)) 8px calc(10px + env(safe-area-inset-left));z-index:20}
#certV[hidden]{display:none}
.cert{display:flex;gap:12px;align-items:stretch;background:var(--panel);border:6px solid var(--fr);outline:4px solid #000;box-shadow:inset 0 0 0 3px var(--fr2);padding:10px;max-width:calc(100vw - 140px);animation:stamp .35s cubic-bezier(.2,1.5,.5,1) backwards}
.cert canvas{height:min(76vh,330px);aspect-ratio:96/54;border:3px solid #000;cursor:pointer;max-width:calc(100vw - 370px);object-fit:contain}
.certR{width:190px;display:flex;flex-direction:column;gap:6px;justify-content:center}
.clab{align-self:flex-start;background:var(--fr);color:#fff;font-weight:900;font-size:14px;padding:2px 8px;border:2px solid #000}
.certR h1{margin:0;font-size:29px;line-height:1.15;color:var(--warn)}
.cwho{font-size:17px;font-weight:800}.csay{font-size:14px;line-height:1.4;color:var(--ink)}.cdate{font-size:12px;color:var(--dim)}
.ench{animation:stamp .35s cubic-bezier(.2,1.5,.5,1) backwards,glow 1.6s infinite steps(4)}
@keyframes glow{50%{box-shadow:inset 0 0 0 3px #fff,0 0 22px #b46eff}}
.ench h1{color:#e9c6ff}
.certbtns{display:flex;flex-direction:column;gap:8px;flex:none}
/* 图鉴 */
#book{position:absolute;inset:0;background:#2b2140;z-index:20;display:flex;flex-direction:column;padding:6px calc(10px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));gap:6px}
#book[hidden]{display:none}.bkh{display:flex;align-items:center;gap:10px}.bkh h2{margin:0;flex:1;font-size:20px}
.bkg{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px;align-content:start}
.bkc{height:84px;background:#3a2d58;border:3px solid #000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px}.bkc canvas{height:52px;width:44px}.bkc small{font-size:12px;font-weight:800;white-space:nowrap}
.bkc.gold{background:#5a3db0;box-shadow:inset 0 0 0 2px #e9c6ff}.bkc.home{outline:3px solid var(--warn);outline-offset:-3px}.bkc.lock small{color:var(--dim)}
.bkd{min-height:54px;background:var(--panel);border:3px solid #000;padding:4px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;line-height:1.35}.bkd .go{min-height:44px;font-size:15px}
/* 战利品箱 */
#loot{position:absolute;inset:0;background:rgba(14,10,28,.92);z-index:21;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
#loot[hidden]{display:none}#lootC{height:38vh;aspect-ratio:40/32;cursor:pointer}.lootT{font-size:20px;font-weight:900;color:var(--warn)}
.lootL{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.lootI{width:96px;background:var(--panel);border:3px solid #000;padding:4px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}.lootI canvas{height:42px;max-width:72px}.lootI b{font-size:13px;line-height:1.15}.lootI small{font-size:11px;color:var(--warn)}
/* 结算 + 颁奖 */
#sum{background:#17191d;align-items:center;justify-content:center}#sum:not([hidden]){display:flex}
.sumbox{display:flex;gap:14px;align-items:stretch;max-width:92vw}
.sumL{width:260px;display:flex;flex-direction:column;gap:8px;justify-content:center}
.sumL h2{margin:0;font-size:22px}
.got{width:min(52vw,420px);background:var(--panel);border:4px solid #000;padding:12px;display:flex;flex-direction:column;gap:8px}
.got h3{margin:0;color:var(--warn);font-size:20px}
.stamp{animation:stamp .35s cubic-bezier(.2,1.5,.5,1) backwards}
@keyframes stamp{from{transform:scale(1.8);opacity:0}}
/* 原型控制 */
#pt{position:fixed;left:50%;transform:translateX(-50%);top:calc(6px + env(safe-area-inset-top));z-index:50}
#ptBtn{height:32px;padding:0 8px;font-size:12px;background:#5b3fa8;color:#fff;border:2px solid #000;font-weight:800}
#ptM{position:absolute;left:50%;transform:translateX(-50%);top:36px;width:230px;background:#2b2140;border:3px solid #000;padding:8px;display:flex;flex-direction:column;gap:6px;font-size:13px}
#ptM[hidden]{display:none}#ptM button{height:36px;background:#5b3fa8;color:#fff;border:2px solid #000;font-weight:700;font-size:13px}#ptM button.on{background:var(--warn);color:#000}
#rot{position:fixed;inset:0;background:#1b1d22;display:none;align-items:center;justify-content:center;font-size:24px;font-weight:900;z-index:90}
@media (orientation:portrait){#rot{display:flex}}
@media print{body *{visibility:hidden}.cert,.cert *{visibility:visible}.cert{position:fixed;left:4vw;top:6vh;width:92vw;max-width:none;background:#fff;color:#000}.cert canvas{height:60vh;max-width:none}.certR h1,.csay,.cwho{color:#000}}
</style>
</head>
<body>
<!-- 岛上：家门口 -->
<div class="scr" id="isl">
  <canvas id="islBg"></canvas>
  <button id="doorHit" aria-label="进入空空的家"></button>
  <div class="newsign" id="newSign" hidden></div>
  <div class="isltip">点门，进入空空的家</div>
</div>
<!-- 屋内 -->
<div class="scr" id="home" hidden>
  <div id="vp"><div id="world"><canvas id="cvRoom"></canvas><canvas id="cvFx"></canvas><canvas id="cvHero"></canvas></div></div>
  <div class="hud">
    <button class="btn" id="btnOut">回到岛上</button>
    <span class="sp"></span>
    <button class="btn" id="btnEdit">摆放</button>
    <div class="tally"><span>奖状 <b id="tC">0</b></span><span>伙伴 <b id="tM">0</b></span><span>钻石 <b id="tD">0</b></span></div>
  </div>
  <div class="toast" id="toast" hidden></div>
  <div class="nav" id="nav"></div>
  <aside class="sheet" id="sheet"></aside>
  <div id="certV" hidden></div>
  <div id="book" hidden></div>
  <div id="loot" hidden></div>
</div>
<!-- 练习结算（颁奖） -->
<div class="scr" id="sum" hidden>
  <div class="sumbox">
    <div class="sumL">
      <h2>今日探险完成</h2>
      <div style="font-weight:800">挖到 <span id="sOre" style="color:var(--warn);font-size:22px">18</span> 块矿石</div>
      <div class="muted">已放入家中木箱</div>
      <div class="muted" id="sUps"></div>
      <button class="btn go" id="sHome" style="margin-top:8px">回家打开</button>
      <button class="btn" id="sIsl">回到岛上</button>
    </div>
    <div class="got"><h3 id="gotT">家门口多了 1 个战利品箱</h3><div class="rows" id="gotL"></div></div>
  </div>
</div>
<div id="pt"><button id="ptBtn">原型</button><div id="ptM" hidden></div></div>
<div id="rot">把手机横过来</div>

<script src="../../v2/bank.js"></script>
<script src="../../v2/core.js"></script>
<script src="../../v2/skills.js"></script>
<script src="../../v2/engine.js"></script>
<script src="../../v2/world.js"></script>
<script src="rewards.js"></script>
<script src="art.js"></script>
<script src="app.js"></script>
</body>
</html>
